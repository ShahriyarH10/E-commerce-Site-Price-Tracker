<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Comparison BD</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>E-commerce Site Price Tracker</h1>
        <p>Compare prices across top Bangladeshi online retailers instantly</p>
    </header>

    <div class="container">
        <!-- Search Input -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for products (e.g., iPhone 15, Miniket Rice)...">
            <button onclick="handleSearch()">Search</button>
        </div>

        <!-- Sites to include in the search -->
        <div class="site-filter">
            <span>Search on:</span>
            <label><input type="checkbox" name="site" value="startech" checked> Star Tech</label>
            <label><input type="checkbox" name="site" value="ryans" checked> Ryans</label>
            <label><input type="checkbox" name="site" value="daraz" checked> Daraz</label>
            <label><input type="checkbox" name="site" value="others" checked> Other BD shops</label>
        </div>

        <div class="results-header">
            <h2 id="resultTitle"></h2>
        </div>

        <!-- Dynamic Results Container -->
        <div id="resultsContainer"></div>
    </div>

    <!-- Link to external JS file -->
    <script src="script.js"></script>
</body>
</html>
